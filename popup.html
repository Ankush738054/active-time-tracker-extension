<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActiveTime Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Subtle Update Alert Banner -->
      <div id="popup-update-banner" class="popup-update-banner hidden">
        <span class="update-text">Update Available (v<span id="popup-latest-ver"></span>) ⚡</span>
        <a id="popup-update-link" href="#" target="_blank" class="btn-update-action">Update ↗</a>
      </div>

      <header>
        <div class="header-title-group">
          <div class="header-title">
            <!-- Logo SVG -->
            <svg class="logo-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="url(#header-logo-grad)" stroke-width="2.5" fill="none"/>
              <path d="M12 6v6l4 2" stroke="url(#header-logo-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <defs>
                <linearGradient id="header-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00F2FE" />
                  <stop offset="100%" stop-color="#7928CA" />
                </linearGradient>
              </defs>
            </svg>
            <h1>ActiveTime</h1>
          </div>
          <a href="#" id="dashboard-btn" class="header-dashboard-link">Open Dashboard ↗</a>
        </div>
        <div class="status-badge" id="status-container">
          <span class="status-dot"></span>
          <span id="status-text">Paused</span>
        </div>
      </header>

      <!-- Tab Buttons Navigation -->
      <div class="tabs-nav">
        <button type="button" class="tab-btn active" id="tab-btn-analytics">Analytics</button>
        <button type="button" class="tab-btn" id="tab-btn-tasks">Tasks</button>
      </div>

      <!-- Tab Content 1: Analytics -->
      <div id="view-analytics" class="tab-content active">
        <!-- Live Session Timer Card -->
        <div class="live-session-card">
          <div class="live-session-icon">
            <img id="live-session-favicon" src="https://www.google.com/s2/favicons?domain=google.com&sz=32" alt="Favicon">
          </div>
          <div class="live-session-info">
            <span class="live-session-label">Live Session Timer</span>
            <div class="live-session-text" id="live-session-text">
              <span class="time" id="live-session-timer">0s</span> on <span id="current-domain">None</span>
            </div>
          </div>
        </div>

        <!-- Hero Speedometer / Radial Gauge -->
        <div class="radial-gauge-container">
          <!-- Subtle background clock watermark -->
          <svg class="clock-watermark" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none" />
            <path d="M12 6v6l4 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
          </svg>
          <svg class="radial-gauge" viewBox="0 0 100 100">
            <path class="gauge-bg" d="M 20 80 A 40 40 0 1 1 80 80" fill="none" stroke-width="6" stroke-linecap="round"/>
            <path class="gauge-fill" id="gauge-fill" d="M 20 80 A 40 40 0 1 1 80 80" fill="none" stroke="url(#gauge-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
          </svg>
          <div class="gauge-content">
            <span class="gauge-label">Today's Total Time</span>
            <h2 class="gauge-value" id="today-total">0m</h2>
          </div>
        </div>

        <!-- Top Websites Leaderboard Box -->
        <div class="section-box">
          <div class="section-label">Top Websites Today</div>
          <div class="leaderboard-list" id="leaderboard-list">
            <div class="leaderboard-item empty">No sites tracked today</div>
          </div>
        </div>
      </div>

      <!-- Tab Content 2: Tasks/Todo List -->
      <div id="view-tasks" class="tab-content">
        <!-- Tasks progress display -->
        <div class="tasks-progress-card">
          <div class="progress-details">
            <span class="progress-title">Today's Goals</span>
            <span class="progress-text" id="tasks-progress-text">0/0 completed</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="tasks-progress-bar" style="width: 0%"></div>
          </div>
        </div>

        <!-- Task Input form -->
        <form id="task-add-form" class="task-add-form">
          <input type="text" id="task-new-input" placeholder="Create a new task..." required maxlength="60">
          <button type="submit" class="btn-add-task">+</button>
        </form>

        <!-- Tasks list -->
        <div class="tasks-list-container">
          <ul id="tasks-list" class="tasks-list">
            <li class="task-empty-state">No tasks created for today</li>
          </ul>
        </div>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="action-buttons-group">
      <button class="btn btn-cloud" id="cloud-toggle-btn">Sync to Cloud</button>
    </div>

    <div class="profile-container" id="profile-container" style="display: none;">
      <div class="profile-info">
        <div class="profile-avatar" id="profile-avatar">A</div>
        <span id="profile-username">Logged in</span>
      </div>
      <button class="btn btn-logout" id="logout-btn">Log Out</button>
    </div>

    <!-- Auth Panel Overlay -->
    <div class="auth-panel" id="auth-panel">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo-group">
            <svg class="logo-svg auth-logo" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="url(#auth-logo-grad)" stroke-width="2.5" fill="none"/>
              <path d="M12 6v6l4 2" stroke="url(#auth-logo-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <defs>
                <linearGradient id="auth-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00F2FE" />
                  <stop offset="100%" stop-color="#7928CA" />
                </linearGradient>
              </defs>
            </svg>
            <h2 id="auth-title">Log In</h2>
          </div>
          <button class="btn-close" id="auth-close-btn">&times;</button>
        </div>
        <form id="auth-form">
          <div class="form-group" id="username-group" style="display: none;">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="Enter username">
          </div>
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="Enter email">
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="auth-password" placeholder="Enter password">
              <button type="button" class="btn-toggle-password" id="toggle-password-btn" title="Toggle password visibility">👁️</button>
            </div>
          </div>
          <div class="form-group" id="otp-group" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label for="auth-otp" style="margin: 0;">One-Time Password (OTP)</label>
              <a href="#" id="auth-resend-link" style="font-size: 0.72rem; color: #00F2FE; text-decoration: none; font-weight: 600;">Resend OTP</a>
            </div>
            <input type="text" id="auth-otp" placeholder="Enter 6-digit verification code" maxlength="6">
          </div>
          <div class="error-msg" id="auth-error-msg" style="display: none;"></div>
          <button type="submit" class="btn btn-submit" id="auth-submit-btn">Log In</button>
        </form>
        <div class="auth-footer">
          <span id="auth-toggle-msg">Don't have an account?</span>
          <a href="#" id="auth-toggle-link">Register</a>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
